# Cluster overlay (aks-dev). Same role as k8s-management/{cluster}/_global.yaml:
# identity, env tags, default resources. App ConfigMap deltas stay in app.yaml.

cluster:
  name: aks-dev
  host: aks-dev.internal

global:
  tags:
    environment: dev
    location: east-us
  image:
    registry: atlas.azurecr.io
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  configurations:
    SPRING_PROFILES_ACTIVE: aks
    ROOT_LOG_LEVEL: INFO
    JAVA_TOOL_OPTIONS: "-XX:+UseG1GC"
