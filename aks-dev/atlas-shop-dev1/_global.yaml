# Namespace overlay (atlas-shop-dev1). Overrides cluster _global.yaml
# for this namespace only. Service-specific deltas still go in app.yaml.

global:
  tags:
    application: atlas-shop
    application-subsystem: catalog-api
  replicas: 2
  configurations:
    APP_LOG_LEVEL: DEBUG

# Optional: cluster-wide defaults for this alias, still overridable in app.yaml.
catalog-api:
  fullnameOverride: catalog-api
  image:
    name: atlas-catalog-api
