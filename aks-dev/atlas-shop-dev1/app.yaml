# Workload overlay (charts[].name: app → this file). Merged last.
# Only put what is different from global / cluster / namespace _global.yaml.

catalog-api:
  enabled: true
  image:
    # registry comes from global.image.registry unless you set it here
    tag: "0.1.0"
  # Example: bump memory for this app only (cpu stays from cluster global).
  resources:
    limits:
      memory: 1Gi
  # Example: override one ConfigMap key. Other keys keep global/cluster values.
  # ROOT_LOG_LEVEL was INFO in aks-dev/_global.yaml; this makes it DEBUG.
  configurations:
    ROOT_LOG_LEVEL: DEBUG
    CATALOG_FEATURE_FLAG: "true"
