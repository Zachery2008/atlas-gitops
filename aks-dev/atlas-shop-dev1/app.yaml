# Workload overlay (charts[].name: app → this file). Merged last.
# Same layout as k8s-management/{cluster}/{ns}/app.yaml:
#   global:      namespace-wide overlay of aks-dev/_global.yaml (all aliases)
#   catalog-api: this service only (image tag, extra env)

global:
  tags:
    application: atlas-shop
  # cpu stays from cluster _global.yaml; this raises the memory limit for the ns.
  resources:
    limits:
      memory: 1Gi
  # Cluster still supplies SPRING_PROFILES_ACTIVE and JAVA_TOOL_OPTIONS.
  configurations:
    ROOT_LOG_LEVEL: DEBUG
    APP_LOG_LEVEL: DEBUG

catalog-api:
  enabled: true
  image:
    tag: "0.1.0"
  configurations:
    CATALOG_FEATURE_FLAG: "true"
